  <mask id="cut"><rect width="32" height="32" fill="#fff"/><circle cx="18.6" cy="13.4" r="13.6"/></mask>
  <circle class="moon" cx="15.2" cy="16.8" r="13.6" mask="url(#cut)"/>
  <g fill="#EC8A1E">
    <circle cx="28" cy="13.4" r="3"/><circle cx="26.2" cy="18.93" r="3"/><circle cx="21.5" cy="22.34" r="3"/>
    <circle cx="15.7" cy="22.34" r="3"/><circle cx="11" cy="18.93" r="3"/><circle cx="9.2" cy="13.4" r="3"/>
    <circle cx="11" cy="7.87" r="3"/><circle cx="15.7" cy="4.46" r="3"/><circle cx="21.5" cy="4.46" r="3"/>
    <circle cx="26.2" cy="7.87" r="3"/>
  </g>
  <circle cx="18.6" cy="13.4" r="9" fill="#F2B233"/>
  <g fill="none" stroke="#2F3E3E" stroke-width="2" stroke-linecap="round">
